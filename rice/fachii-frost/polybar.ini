[colors]
background = #cc0b1c2c
foreground = #d7e6f5
primary = #56b6c2
secondary = #8fd6ba
warning = #e5c07b
urgent = #e06c75

[bar/fachii]
width = 100%
height = 28
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
padding = 2
module-margin = 2
modules-left = powermenu workspaces
modules-center = date
modules-right = cpu memory pulseaudio network battery
tray-position = right

[module/powermenu]
type = custom/text
content = "  Fachii"
content-foreground = ${colors.primary}

[module/workspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.secondary}
label-occupied = %name%
label-urgent = %name%
label-urgent-foreground = ${colors.urgent}

[module/date]
type = internal/date
date = %a %d %b
interval = 60
label = %date%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
format = "CPU %percentage%%"
format-foreground = ${colors.primary}

[module/memory]
type = internal/memory
format = "RAM %percentage_used%%"
format-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = "  %percentage%%"
format-volume-foreground = ${colors.primary}
label-muted = "󰝟  muted"
label-muted-foreground = ${colors.warning}

[module/network]
type = internal/network
interface = wlan0
interval = 5
format-connected = "  %essid%"
format-connected-foreground = ${colors.secondary}
format-disconnected = "  offline"
format-disconnected-foreground = ${colors.warning}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = "  %percentage%%"
format-discharging = "  %percentage%%"
format-full = "  full"
format-foreground = ${colors.primary}
