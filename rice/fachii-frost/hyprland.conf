# Fachii Frost Hyprland template (adjust as needed)
# Place in ~/.config/hypr/hyprland.conf

monitor=,preferred,auto,1

# Colors
$base = 0x0b1c2c
$accent = 0x56b6c2
$accent2 = 0x8fd6ba

# General appearance
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 3
    col.active_border = rgba(0x56b6c2ff)
    col.inactive_border = rgba(0x0b1c2caa)
    layout = master
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        ignore_opacity = false
    }
    drop_shadow = true
    shadow_range = 12
    shadow_render_power = 3
    col.shadow = rgba(0x0b1c2c66)
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, ease
    animation = border, 1, 4, ease
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 6, ease
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# Wallpaper command placeholder
# exec-once = swaybg -i ~/Pictures/fachii-frost.jpg -m fill

# Status bar placeholder
# exec-once = waybar

# Apps
bind=SUPER,RETURN,exec,alacritty
bind=SUPER,Q,killactive
bind=SUPER,SPACE,exec,rofi -show drun
bind=SUPER,SHIFT,E,exit
bind=SUPER,D,exec,nautilus
