# Fachii Linux neofetch configuration
# This file is copied to /etc/skel/.config/neofetch/config.conf during build.

print_info() {
    info "ascii" "$(cat /etc/skel/.config/neofetch/ascii.txt)"
    info "OS" distro
    info "Kernel" kernel
    info "Desktop" de
    info "Window Manager" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "Packages" packages
    info "Memory" memory
}

# Use custom ASCII art
ascii_distro="auto"
ascii="/etc/skel/.config/neofetch/ascii.txt"
ascii_colors=(6 14 14 6 6 14)
ascii_bold=on

# Display tweaks
distro_shorthand="on"
title_fqdn="off"
underline_enabled="on"
separator="─"

colors=(6 7 14 6 6 15)
color_blocks=on
progress_char="▰"
bar_char_elapsed="▱"
bar_char_total="▰"
